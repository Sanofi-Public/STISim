[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stisim"
version = "0.1.0"
description = "An agent-based simulation framework for sexually transmitted infections transmission and vaccination strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Qi Deng" }
]
keywords = [
  "agent-based model",
  "sexually infectious disease",
  "chlamydia",
  "vaccination",
  "sexual network",
  "simulation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Sanofi non-commercial license",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "scipy>=1.10"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0"
]

[tool.setuptools]
packages = ["STISim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
